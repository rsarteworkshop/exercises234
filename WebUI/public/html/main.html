<html>
    <head>
        <meta charset="utf-8" />
        <title>Traffic Light</title>

        <link type="text/css" rel="stylesheet" href="/css" />
    </head>

    <body>

        <button type="button" id="close_ew_button">Close East/West Lane</button>
        <button type="button" id="open_ew_button">Open East/West Lane</button>

        <div id="intersection-layout">
            <div class="light-panel" id="north-light-panel">
                <h3 id="ns-light-label">North/South: N/A</h3>
                <div class="traffic-light">
                    <svg>
                       <g stroke="black" fill="#333">
                          <path d="m10 10 l 0 510 l 200 0 l 0 -510 z"></path>
                          <path fill="#444" d="m20 20 l 0 490 l 180 0 l 0 -490 z"></path>
                          <circle cx="110" cy="100" r="75" id="rl"></circle>
                          <circle cx="110" cy="260" r="75" id="yl"></circle>
                          <circle cx="110" cy="420" r="75" id="gl"></circle>
                       </g>
                    </svg>
                </div>
            </div>

            <div id="intersection-panel">
                <img id="pedSignal" src="/images/intersection"/>
            </div>

            <div class="light-panel" id="east-light-panel">
                <h3 id="ew-light-label">East/West: N/A</h3>
                <div class="traffic-light">
                    <svg>
                       <g stroke="black" fill="#333">
                          <path d="m10 10 l 0 510 l 200 0 l 0 -510 z"></path>
                          <path fill="#444" d="m20 20 l 0 490 l 180 0 l 0 -490 z"></path>
                          <circle cx="110" cy="100" r="75" id="erl"></circle>
                          <circle cx="110" cy="260" r="75" id="eyl"></circle>
                          <circle cx="110" cy="420" r="75" id="egl"></circle>
                       </g>
                    </svg>
                </div>
            </div>
        </div>

        <p id="pedCounter"></p>

        <script src="/socket.io/socket.io.js"></script>
        <script src="/jquery"></script>        
        <script src="/main"></script>

        <script>
                const existingStylesheet = document.querySelector('link[rel="stylesheet"]');
                if (existingStylesheet) {
                    existingStylesheet.href = './css/';
                } else {    
                    const newStylesheet = document.createElement('link');
                    newStylesheet.type = 'text/css';
                    newStylesheet.rel = 'stylesheet';
                    newStylesheet.href = './css/';
                    document.head.appendChild(newStylesheet);
                }                


                document.querySelectorAll('script').forEach(script => {
                    if (script.src.includes('/socket.io/socket.io.js') || 
                        script.src.includes('/jquery') || 
                        script.src.includes('/main')) {
                        script.remove();
                    }
                });

                const scripts = [
                    './socket.io/socket.io.js',
                    './jquery',
                    './main'
                ];
                async function loadScript(src) {
                    return new Promise((resolve, reject) => {
                        const script = document.createElement('script');
                        script.src = src;
                        script.onload = () => resolve();
                        script.onerror = () => reject(new Error(`Failed to load script: ${src}`));
                        document.body.appendChild(script);
                    });
                }

                (async () => {
                    try {
                        await loadScript('./socket.io/socket.io.js');
                        await loadScript('./jquery');
                        await loadScript('./main');
                    } catch (error) {
                        console.error(error);
                    }
                })();

            

        </script>

    </body>
</html>
